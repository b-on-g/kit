name: $bog_kit

permissions: write-all

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    # Обе точки входа собираются одним прогоном: `modules` бьётся по пробелам
    # и каждое имя дописывается к пакету. Артефакты ложатся в <модуль>/-/.
    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog/kit'
        modules: 'app app2'

    # GitHub Pages отдаёт web.js с `cache-control: max-age=600`, поэтому первые
    # десять минут после деплоя вернувшийся читатель получает старый бандл и
    # видит ровно то, что уже починили. Ссылка со стемпом коммита делает адрес
    # бандла новым на каждый деплой — кэшу нечего отдавать.
    - name: Cache-bust the bundle
      if: github.ref == 'refs/heads/master'
      run: |
        set -euo pipefail
        stamp="${GITHUB_SHA::7}"
        for module in app app2; do
          file="bog/kit/$module/-/index.html"
          sed -i "s|src=\"web.js\"|src=\"web.js?v=$stamp\"|" "$file"
          grep -q "web.js?v=$stamp" "$file"
        done

    # Корень — витрина со ссылками. `clean-exclude` обязателен: без него
    # rsync --delete в корне снёс бы папки приложений. Всё, чего в списке нет,
    # из корня удаляется — так ушла папка app3.
    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/kit/deploy'
        clean-exclude: |
          app
          app2

    # У каждой точки входа свой адрес. `target-folder` уводит rsync --delete
    # внутрь подпапки, поэтому соседей и корень они не трогают.
    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/kit/app/-'
        target-folder: 'app'
        commit-message: 'deploy app'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/master'
      with:
        folder: 'bog/kit/app2/-'
        target-folder: 'app2'
        commit-message: 'deploy app2'

    - name: URLs
      if: github.ref == 'refs/heads/master'
      run: |
        {
          echo "- https://b-on-g.github.io/kit/"
          echo "- https://b-on-g.github.io/kit/app/ — сток"
          echo "- https://b-on-g.github.io/kit/app2/ — Kit"
        } >> "$GITHUB_STEP_SUMMARY"
