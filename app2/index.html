<!doctype html>
<html mol_view_root>
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover puts the content under the notch, which is where the
		     safe-area insets in shell.view.css then push it back out. Without
		     user-scalable=no a double tap zooms, and nothing says "web page" faster. -->
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Kit" />
		<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1a1f27" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="manifest.json" />
		<title>Kit</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
	</head>
	<body mol_view_root>
		<div mol_view_root="$bog_kit_app2"></div>
		<script src="web.js"></script>
	</body>
</html>
